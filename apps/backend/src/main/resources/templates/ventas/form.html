<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nueva Venta</title>
</head>
<body>
<h1>Nueva Venta</h1>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form th:action="@{/ventas/guardar}" method="post" th:object="${ventaForm}">
    <label>Cliente:</label>
    <select th:field="*{clienteId}" required>
        <option value="">-- Seleccione --</option>
        <option th:each="c : ${clientes}"
                th:value="${c.id}"
                th:text="${c.nombre}"></option>
    </select>

    <hr/>

    <h3>Productos</h3>

    <div th:each="it, stat : *{items}">
        <p><b>Ítem <span th:text="${stat.index + 1}"></span></b></p>

        <label>Producto:</label>
        <select th:field="*{items[__${stat.index}__].productoId}">
            <option value="">-- Seleccione --</option>
            <option th:each="p : ${productos}"
                    th:value="${p.id}"
                    th:text="${p.nombre + ' (stock: ' + p.stock + ')'}"></option>
        </select>

        <label>Cantidad:</label>
        <input type="number" min="1" th:field="*{items[__${stat.index}__].cantidad}"/>

        <hr/>
    </div>

    <button type="submit">Registrar Venta</button>
    <a href="/productos">Volver</a>
</form>

</body>
</html>
