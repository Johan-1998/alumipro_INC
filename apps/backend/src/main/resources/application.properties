server.port=${SERVER_PORT:8080}
spring.application.name=alumipro

# ── BASE DE DATOS ──────────────────────────────────────────────────────────────
# XAMPP con MariaDB 10.4 — sin contraseña, puerto 3306
spring.datasource.url=jdbc:mariadb://localhost:3306/alumipro_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA / HIBERNATE ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# MariaDB 10.4 dialect — NO usar MySQL8Dialect con MariaDB, causa errores de DDL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.open-in-view=false

# ── OTROS ──────────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
app.jwt.secret=${JWT_SECRET:ALUMIPRO_JWT_SECRET_CAMBIAR_EN_PROD_1234567890}
app.jwt.expirationMinutes=${JWT_EXPIRE_MINUTES:480}
